name: ci

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Check vocabularies and build the site
        run: uv run scripts/build.py build
      - name: Released files are never changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- releases/)
          if [ -n "$changed" ]; then echo "Released files must not change:"; echo "$changed"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Create GitHub release for <name>-v<version>
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -xf artifact.tar
          name="${TAG%-v*}"; version="${TAG##*-v}"
          dir="releases/$name/$version"
          test -f "$dir/$name.owl" || { echo "missing $dir/$name.owl; run scripts/build.py release $name $version"; exit 1; }
          gh release create "$TAG" "$dir/$name.owl" "$dir/$name.ttl" \
            --repo "${{ github.repository }}" \
            --title "$name $version" \
            --notes "Fixed copy: https://dfg-sos.github.io/ontologies/$dir/$name.owl"
