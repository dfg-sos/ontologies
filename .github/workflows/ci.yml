name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Check vocabularies and build the site
        run: uv run scripts/build.py build
      - name: Released files are never changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then echo "no base commit, skipped"; exit 0; fi
          changed=$(git diff --name-only --diff-filter=MDR "$BASE...HEAD" -- releases/)
          if [ -n "$changed" ]; then echo "Released files must not change:"; echo "$changed"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
